<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initialscale=1.0">
    <title>Weather Station</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="weather-wrapper">
        <!----seach box----->
        <header class="search-box">
            <input type="text" placeholder="Enter City Name .....">
            <button type="button">SEARCH</button>
        </header>
        <!---main display components-->
        <main class="Current Weather">
            <h1 class="location">Zimbabwe, hr</h1>
            <div class="visuals">
                <img src="icons/thunderstorm" alt="⚡️" class="weather-icon">
                <span class="temperature ">15°C</span>
            </div>
            <p class="condition">Thunder Storm</p>
        </main>
        <!--Secondary Details Component-->
        <section class="weather-metrics">
            <div class="metric-card">
                <span class="label">Humidity</span>
                <span class="value">75%</span>
            </div>

            <div class="metric-card">
                <span class="label">Wind Speed</span>
                <span class="value">12 km/h</span>
            </div>
        </section>
    </div>
</body>

</html>
